<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPF</title>
<style>
:root {
  --bg: #ffffff; --panel: #f7f7f8; --panel2: #ececf1; --ink: #0d0d0d; --ink2: #5d5d6b;
  --muted: #8e8ea0; --line: #e5e5e5; --accent: #10a37f; --accent-ink: #ffffff;
  --user: #f4f4f4; --warn: #b45309; --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #212121; --panel: #171717; --panel2: #2f2f2f; --ink: #ececec; --ink2: #b4b4b4;
          --muted: #8e8e8e; --line: #333; --accent: #19c37d; --accent-ink: #0d0d0d; --user: #2f2f2f; --warn: #f59e0b; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); display: flex;
       font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
button, input, textarea { font: inherit; color: inherit; }

/* sidebar */
aside { width: 280px; background: var(--panel); border-right: 1px solid var(--line); display: flex;
        flex-direction: column; padding: 14px; gap: 14px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
.brand svg { width: 26px; height: 26px; }
.brand small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }
.newchat { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 12px;
           text-align: left; cursor: pointer; }
.newchat:hover { background: var(--panel2); }
.section-title { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 4px 2px -6px; }
.model { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; background: var(--bg); }
.model:hover { border-color: var(--muted); }
.model.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.model.disabled { opacity: .45; cursor: not-allowed; }
.model .name { font-weight: 600; font-size: 14px; }
.model .desc { font-size: 12.5px; color: var(--ink2); margin-top: 2px; }
.setting label { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink2); }
.setting input[type=range] { width: 100%; accent-color: var(--accent); }
.toggle { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink2); cursor: pointer; }
.toggle input { accent-color: var(--accent); margin-top: 3px; }
.side-foot { margin-top: auto; font-size: 11.5px; color: var(--muted); }
.side-foot a { color: var(--muted); }

/* main */
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
header { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--line); }
header .title { font-weight: 600; }
header .sub { color: var(--muted); font-size: 13px; }
#menu { display: none; border: 0; background: none; cursor: pointer; font-size: 20px; }
#chat { flex: 1; overflow-y: auto; }
.thread { max-width: 780px; margin: 0 auto; padding: 24px 18px 8px; }
.empty { text-align: center; margin-top: 12vh; }
.empty h1 { font-size: 28px; font-weight: 600; margin: 0 0 6px; }
.empty p { color: var(--ink2); margin: 0 0 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; background: var(--bg);
        font-size: 13.5px; white-space: pre; }
.chip:hover { background: var(--panel2); }
.msg { margin: 18px 0; display: flex; gap: 12px; }
.msg.user { justify-content: flex-end; }
.msg.user .bubble { background: var(--user); border-radius: 18px; padding: 10px 16px; max-width: 75%; white-space: pre-wrap; }
.avatar { flex: 0 0 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; }
.avatar svg { width: 18px; height: 18px; }
.bot { flex: 1; min-width: 0; }
.bot .who { font-size: 12.5px; color: var(--muted); margin-bottom: 2px; }
.bot .text { white-space: pre-wrap; word-wrap: break-word; }
.bot .text .echo { color: var(--muted); }
.cursor { display: inline-block; width: 8px; height: 1.05em; background: var(--ink); vertical-align: -2px; margin-left: 1px;
          animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.bot .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
.bot .status { font-size: 13px; color: var(--muted); font-style: italic; }
.bot .error { color: var(--warn); font-size: 13.5px; }

/* composer */
.composer-wrap { padding: 10px 18px 16px; }
.composer { max-width: 780px; margin: 0 auto; background: var(--panel2); border-radius: 26px; display: flex;
            align-items: flex-end; padding: 8px 8px 8px 18px; gap: 8px; }
.composer textarea { flex: 1; border: 0; outline: none; background: transparent; resize: none; max-height: 200px;
                     padding: 7px 0; line-height: 1.5; }
.send { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg);
        cursor: pointer; display: grid; place-items: center; flex: 0 0 36px; }
.send:disabled { opacity: .3; cursor: default; }
.send svg { width: 18px; height: 18px; }
.hint { max-width: 780px; margin: 7px auto 0; text-align: center; font-size: 12px; color: var(--muted); }

@media (max-width: 760px) {
  aside { position: fixed; inset: 0 auto 0 0; z-index: 5; transform: translateX(-100%); transition: transform .2s; }
  aside.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.3); }
  #menu { display: block; }
  .msg.user .bubble { max-width: 88%; }
}
</style>
</head>
<body>
<aside id="side">
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <ellipse cx="16" cy="19" rx="4.2" ry="7"/><circle cx="16" cy="9.5" r="3"/>
      <path d="M12.5 15c-4-3-8-3-9.5-1 1 3 5 4 9.5 3M19.5 15c4-3 8-3 9.5-1-1 3-5 4-9.5 3"/>
      <path d="M12 21l-4 3M20 21l4 3M12 18l-4.5 0M20 18l4.5 0M14 7l-2-3M18 7l2-3"/>
    </svg>
    <div>GPF<small>Generative Pretrained Fly</small></div>
  </div>
  <button class="newchat" id="newchat">＋ New chat</button>
  <div class="section-title">Model</div>
  <div id="models"></div>
  <div class="section-title">Sampling</div>
  <div class="setting"><label>Temperature <span id="tv">0.7</span></label><input id="temp" type="range" min="0.1" max="1.5" step="0.05" value="0.7"></div>
  <div class="setting"><label>Characters to write <span id="nv">300</span></label><input id="n" type="range" min="50" max="1000" step="50" value="300"></div>
  <div class="setting"><label>Top-k <span id="kv">off</span></label><input id="topk" type="range" min="0" max="20" step="1" value="0"></div>
  <div class="setting"><label>Seed <span id="sv">0</span></label><input id="seed" type="range" min="0" max="99" step="1" value="0"></div>
  <label class="toggle"><input type="checkbox" id="ctx"> Feed the whole conversation back as context</label>
  <div class="side-foot">Pretrained by evolution. Fine-tuned on 20k characters of Shakespeare.<br>
    <a href="https://github.com/LxCenady/Fly-Is-All-You-Need" target="_blank" rel="noopener">Fly-Is-All-You-Need</a></div>
</aside>

<main>
  <header>
    <button id="menu" aria-label="Menu">☰</button>
    <span class="title" id="htitle">GPF</span><span class="sub" id="hsub"></span>
  </header>
  <div id="chat"><div class="thread" id="thread"></div></div>
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Start a line of Shakespeare and the model will continue it"></textarea>
      <button class="send" id="send" aria-label="Send" disabled>
        <svg id="icon-send" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l7 7-1.4 1.4L13 7.8V20h-2V7.8l-4.6 4.6L5 11z"/></svg>
        <svg id="icon-stop" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
      </button>
    </div>
    <div class="hint">GPF continues your text; it is not a chatbot. The fly remembers about four characters, so it writes the worst Shakespeare here.</div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const FLY = $(".brand svg").outerHTML;
let models = [], current = null, history = [], busy = false, controller = null;

function bindRange(id, out, fmt) {
  const el = $(id), o = $(out);
  const f = () => o.textContent = fmt(el.value);
  el.addEventListener("input", f); f();
}
bindRange("#temp", "#tv", v => (+v).toFixed(2));
bindRange("#n", "#nv", v => v);
bindRange("#topk", "#kv", v => +v ? v : "off");
bindRange("#seed", "#sv", v => v);

function renderModels() {
  const box = $("#models"); box.innerHTML = "";
  for (const m of models) {
    const d = document.createElement("div");
    d.className = "model" + (m.key === current ? " selected" : "") + (m.available ? "" : " disabled");
    d.innerHTML = `<div class="name"></div><div class="desc"></div>`;
    d.querySelector(".name").textContent = m.name;
    d.querySelector(".desc").textContent = m.available ? m.desc : "Needs flybrain (pip install \"flybrain[gpu]\") and an NVIDIA GPU.";
    if (m.available) d.onclick = () => { current = m.key; renderModels(); renderHeader(); };
    box.appendChild(d);
  }
}
function renderHeader() {
  const m = models.find(x => x.key === current);
  $("#htitle").textContent = m ? m.name : "GPF";
  $("#hsub").textContent = m ? "· " + m.desc : "";
}
function renderEmpty() {
  const t = $("#thread"); t.innerHTML = "";
  const e = document.createElement("div"); e.className = "empty";
  e.innerHTML = `<h1>What should the fly write?</h1><p>Give it the start of a line; it writes on, one character at a time.</p><div class="chips"></div>`;
  for (const s of ["ROMEO:\n", "First Citizen:\n", "To be, or not to be", "KING RICHARD III:\n", "O, "]) {
    const c = document.createElement("button"); c.className = "chip"; c.textContent = s.replace("\n", "↵");
    c.onclick = () => send(s); e.querySelector(".chips").appendChild(c);
  }
  t.appendChild(e);
}
function addUser(text) {
  const t = $("#thread"); if (t.querySelector(".empty")) t.innerHTML = "";
  const d = document.createElement("div"); d.className = "msg user";
  d.innerHTML = `<div class="bubble"></div>`; d.querySelector(".bubble").textContent = text;
  t.appendChild(d); scroll();
}
function addBot(name, prompt) {
  const d = document.createElement("div"); d.className = "msg";
  d.innerHTML = `<div class="avatar">${FLY}</div><div class="bot"><div class="who"></div>
    <div class="status"></div><div class="text"><span class="echo"></span><span class="out"></span><span class="cursor"></span></div>
    <div class="meta"></div></div>`;
  d.querySelector(".who").textContent = name;
  d.querySelector(".echo").textContent = prompt;
  $("#thread").appendChild(d); scroll();
  return d;
}
function scroll() { const c = $("#chat"); c.scrollTop = c.scrollHeight; }
function setBusy(b) {
  busy = b; $("#icon-send").style.display = b ? "none" : ""; $("#icon-stop").style.display = b ? "" : "none";
  $("#send").disabled = !b && !$("#input").value.trim();
  $("#send").setAttribute("aria-label", b ? "Stop" : "Send");
}

async function send(text) {
  if (busy || !current) return;
  text = text ?? $("#input").value;
  if (!text.trim()) return;
  $("#input").value = ""; autosize();
  const m = models.find(x => x.key === current);
  addUser(text);
  let prompt = text;
  if ($("#ctx").checked) prompt = (history.map(h => h.prompt + h.out).join("") + text).slice(-2000);
  const node = addBot(m.name, text);
  const out = node.querySelector(".out"), status = node.querySelector(".status");
  setBusy(true); controller = new AbortController();
  let acc = "", pending = "";
  const flush = () => { if (pending) { out.textContent += pending; pending = ""; scroll(); } };
  const timer = setInterval(flush, 40);
  try {
    const res = await fetch("/api/generate", {
      method: "POST", headers: {"Content-Type": "application/json"}, signal: controller.signal,
      body: JSON.stringify({model: current, prompt, n: +$("#n").value, temp: +$("#temp").value,
                            topk: +$("#topk").value, seed: +$("#seed").value})
    });
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith("data: ")) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.c !== undefined) { status.textContent = ""; acc += ev.c; pending += ev.c; }
        else if (ev.status) status.textContent = ev.status;
        else if (ev.error) { status.textContent = ""; node.querySelector(".meta").innerHTML = `<span class="error"></span>`;
                             node.querySelector(".error").textContent = "Error: " + ev.error; }
        else if (ev.done) node.querySelector(".meta").textContent =
             `${ev.chars} characters · ${ev.seconds}s · ${ev.rate} characters/s`;
      }
    }
  } catch (e) {
    if (e.name === "AbortError") node.querySelector(".meta").textContent = "stopped";
    else node.querySelector(".meta").textContent = "connection lost";
  } finally {
    clearInterval(timer); flush(); status.textContent = "";
    node.querySelector(".cursor").remove();
    history.push({prompt: text, out: acc}); setBusy(false);
  }
}

function autosize() { const t = $("#input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 200) + "px";
                      if (!busy) $("#send").disabled = !t.value.trim(); }
$("#input").addEventListener("input", autosize);
$("#input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("#send").onclick = () => busy ? controller && controller.abort() : send();
$("#newchat").onclick = () => { if (busy) return; history = []; renderEmpty(); };
$("#menu").onclick = () => $("#side").classList.toggle("open");

fetch("/api/models").then(r => r.json()).then(list => {
  models = list;
  current = (list.find(m => m.key === "brain" && m.available) || list.find(m => m.available)).key;
  renderModels(); renderHeader(); renderEmpty();
});
</script>
</body>
</html>
