[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uctf"
version = "0.1.0"
description = "Universal Connectome Training Framework: any wiring diagram as a character-level language model, with the controls that ask whether the wiring matters"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Quanxi Li"}]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
malecns = ["flybrain[gpu]==0.1.0"]

[tool.setuptools]
packages = ["uctf"]

[tool.setuptools.package-data]
uctf = ["specs/*.json"]
